<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="gMain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Solid Dark Rounded Square Base -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.25" />

  <!-- BOLD GYM DUMBBELL + LEVEL UP ARROW EMBLEM -->
  <!-- 1. Left Outer Weight Plate -->
  <rect x="10" y="28" width="6" height="24" rx="3" fill="url(#gMain)" />

  <!-- 2. Left Inner Weight Plate -->
  <rect x="18" y="32" width="5" height="16" rx="2.5" fill="url(#gMain)" />

  <!-- 3. Right Inner Weight Plate -->
  <rect x="41" y="32" width="5" height="16" rx="2.5" fill="url(#gMain)" />

  <!-- 4. Right Outer Weight Plate -->
  <rect x="48" y="28" width="6" height="24" rx="3" fill="url(#gMain)" />

  <!-- 5. Dumbbell Horizontal Shaft -->
  <rect x="14" y="37" width="36" height="6" rx="3" fill="url(#gMain)" />

  <!-- 6. Rising Level Up Arrowhead (Merged into dumbbell center) -->
  <path d="M 32 8 L 44 24 L 36 24 L 36 40 L 28 40 L 28 24 L 20 24 Z" fill="url(#gMain)" />

  <!-- 7. Solid White Core Accent -->
  <polygon points="32,13 39,22 35,22 35,35 29,35 29,22 25,22" fill="#ffffff" />
</svg>
